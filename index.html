  <title>The Paradigm Architects | Innovation & Sustainability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nickel: 'var(--color-nickel)',
            fuscous: 'var(--color-fuscous)',
            pine: 'var(--color-pine)',
            leather: 'var(--color-leather)',
          },
          fontFamily: {
            architectural: ['ABSTER', 'Syncopate', 'sans-serif'],
            body: ['Ginora Sans', 'Century Gothic', 'Questrial', 'sans-serif'],
            gothic: ['Century Gothic', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Questrial&display=swap');

    @font-face {
      font-family: 'ABSTER';
      src: url('/paradigm/fonts/abster-500.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Ginora Sans';
      src: url('/paradigm/fonts/Ginora-Sans-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Ginora Sans';
      src: url('/paradigm/fonts/Ginora-Sans-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Ginora Sans';
      src: url('/paradigm/fonts/Ginora-Sans-Semi-Bold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'Ginora Sans';
      src: url('/paradigm/fonts/Ginora-Sans-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --color-nickel: #C6C6C5;
      --color-fuscous: #535150;
      --color-pine: #6C5A4C;
      --color-leather: #A07457;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-nickel);
      color: var(--color-fuscous);
      font-family: 'Ginora Sans', 'Century Gothic', 'Questrial', sans-serif;
      overflow-x: hidden;
    }

    .font-architectural {
      font-family: 'ABSTER', 'Syncopate', sans-serif;
    }

    .font-body {
      font-family: 'Ginora Sans', 'Century Gothic', 'Questrial', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--color-nickel);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-fuscous);
    }
  </style>
